name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a queued run supersedes the one waiting, but never cancels a
# deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The release that holds model.onnx. Bump it when the exported graph changes.
  MODEL_TAG: model-v1

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # onnxruntime-node's postinstall downloads CUDA execution-provider binaries from NuGet
      # on Linux, which fails on a plain runner. CI never runs it - it is only used locally
      # by scripts/record_fixture.mjs - so the non-bundled downloads are skipped.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # VITE_BASE must match where the site is served from. For GitHub Pages that is
      # /<repo>/; for Cloudflare Pages, Netlify or your own server set it to "/".
      # VITE_MODEL_URL points at the weights - see the "Hosting" section of the README.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Absolute, because og:image and og:url have to be: link previews are fetched by
          # a crawler that has no page to resolve a relative path against.
          VITE_SITE_URL: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

      # The 89 MB weights are not in git. They come from the GitHub Release and are placed
      # inside dist/ so the deployed app fetches them from its own origin: release assets are
      # served without an `access-control-allow-origin` header, so fetching one from a browser
      # on another origin is blocked by CORS. Publish them with scripts/publish_model.sh.
      - name: Fetch the model weights from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/model
          gh release download "$MODEL_TAG" --repo "$GITHUB_REPOSITORY" --pattern model.onnx --dir dist/model --clobber
          ls -l dist/model/model.onnx

      # enablement: true only configures a site that already exists. It cannot create one:
      # the default GITHUB_TOKEN gets "Resource not accessible by integration". Enable Pages
      # once per repository before the first deploy, then this step is a no-op:
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A deploy that returns 200 but serves the wrong document is still a broken deploy.
      - name: Verify the deployed page
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "checking $url"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sL -o page.html -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ] && grep -q "Inside the LLM" page.html; then
              echo "live and serving the app"
              exit 0
            fi
            echo "attempt $attempt: http $code, retrying in 15s"
            sleep 15
          done
          echo "the deployed page never served the app"
          exit 1
